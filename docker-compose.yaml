services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    image: resume-tracker:latest
    container_name: fastapi_api
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db
    env_file:
      - .env
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src

  celery:
    image: resume-tracker:latest
    container_name: celery
    environment:
      - PYTHONPATH=/app
    command: celery -A src.celery.celery_app.celery worker --loglevel=info --pool=solo
    depends_on:
      - api
      - redis
      - db
    env_file:
      - .env
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    image: resume-tracker:latest
    container_name: worker
    # environment:
    #   - PYTHONPATH=/app
    command: python src/jobs/scheduler_worker.py
    depends_on:
      - api
      - redis
      - db
    env_file:
      - .env
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  db:
    image: postgres:16
    container_name: postgres_db
    env_file:
      - .env
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
    pgdata: