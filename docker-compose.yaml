services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    image: resume-tracker:latest
    container_name: resume-parser-api
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src

  celery:
    image: resume-tracker:latest
    container_name: resume-parser-celery
    environment:
      - PYTHONPATH=/app
    command: celery -A src.celery.celery_app.celery worker --loglevel=info --pool=solo
    depends_on:
      - api
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    image: resume-tracker:latest
    container_name: resume-parser-worker
    # environment:
    #   - PYTHONPATH=/app
    command: ["python", "-m", "src.jobs.scheduler_worker"]
    depends_on:
      - api
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: resume-parser-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"