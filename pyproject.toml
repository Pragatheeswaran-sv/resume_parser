[project]
name = "resume-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.129.0,<0.130.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "celery (>=5.6.2,<6.0.0)",
    "redis (>=7.2.0,<8.0.0)",
    "pypdf (>=6.7.1,<7.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "ollama (>=0.6.1,<0.7.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "apscheduler (>=3.11.0,<4.0.0)",
    "python-jose[cryptography]",
    "bcrypt",
    "openai (>=2.30.0,<3.0.0)",
    "anthropic (>=0.89.0,<0.90.0)",
    "requests",
    "pikepdf (>=10.5.1,<11.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "lxml (>=6.1.0,<7.0.0)",
    "phonenumbers (>=9.0.29,<10.0.0)",
    "reportlab (>=4.4.4,<5.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "rapidfuzz (>=3.14.5,<4.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "tomlkit (>=0.15.0,<0.16.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "*_test_case.py"]
pythonpath = ["."]             
filterwarnings = [
    "ignore::DeprecationWarning"
]
